# Free model provider, decoding settings and limits (implementation-plan.md §5.3, §13.1).
# Every condition in an experiment uses the same settings. See docs/adr/0004-free-llm-provider.md.
version: 1

provider:
  name: nvidia-api-catalog
  base_url: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY

# Measured on 2026-11-05 with no retries: about 8 requests a minute got through, whatever the prompt
# size (90 to 14,000 tokens), after a short burst. The published figure of about 40 did not hold for
# this key. We pace just below what was measured, with one key, so requests are not wasted on 429s.
rate_limit:
  requests_per_minute: 7.5
  max_concurrent: 4
  max_attempts: 8
  base_backoff_seconds: 2
  max_backoff_seconds: 120
  request_timeout_seconds: 240

# Primary runs. Stability and self-consistency runs override the temperature (§11.4).
decoding:
  temperature: 0
  seed: 20261103
  max_tokens: 16384

limits:
  tool_calls_per_turn: 8
  single_agent_tool_calls: 32
  repair_attempts: 1
  requests_per_case: 80

# Chosen from what this account can actually reach, on 2026-11-04 (results in ADR-0004).
# NVIDIA lists more models than it serves to an account, so a listed model can still return 404.
roles:
  primary: nvidia/nemotron-3.5-super-vl-120b-a12b
  capability_arm: nvidia/nemotron-3.5-lightning-30b-a3b
  larger_single: nvidia/nemotron-3-ultra-550b-a55b
  paraphrase: mistralai/mistral-large-4-1t-a52b

# What `tessera-probe` measures by default. Pass --models to try anything else.
candidates:
  primary:
    - nvidia/nemotron-3.5-super-vl-120b-a12b
  capability_arm:
    - nvidia/nemotron-3.5-lightning-30b-a3b
  larger_single:
    - nvidia/nemotron-3-ultra-550b-a55b
    - mistralai/mistral-large-4-1t-a52b
  paraphrase:
    - mistralai/mistral-large-4-1t-a52b
    - deepseek-ai/deepseek-v4.1-flash

# Provider-specific request fields, per model. Reasoning is on by default for the primary model.
# It is stated here so that a change of default cannot alter a run unnoticed.
model_options:
  nvidia/nemotron-3.5-super-vl-120b-a12b:
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
