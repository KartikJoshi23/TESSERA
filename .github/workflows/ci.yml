name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Commit guard (restricted data, DFSA deep links, API keys)
        run: python scripts/check_restricted.py --all

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Type check
        working-directory: backend
        run: uv run mypy src

      - name: Tests (network blocked)
        working-directory: backend
        run: uv run pytest -q
