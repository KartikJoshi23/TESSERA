[project]
name = "tessera"
version = "0.1.0"
description = "TESSERA: evidence-linked checks of synthetic investment offers against UAE regulator records (internal research)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
    "phonenumbers>=8.13",
    "schwifty>=2024.6",
    "httpx>=0.27",
]

[project.scripts]
tessera-ingest = "tessera.data.ingest:main"
tessera-probe = "tessera.llm.probe:main"
tessera-smoke = "tessera.agents.smoke:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Look-alike characters are intentional in the homoglyph tables and their tests.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are row-per-line data tables; wrapping them hurts readability.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
